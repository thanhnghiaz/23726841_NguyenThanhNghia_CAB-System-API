openapi: 3.0.3
info:
  title: CAB System - FR-02 Driver Dispatch API
  version: 1.0.0
  description: API tổng hợp cho nhóm yêu cầu chức năng FR-02.01 đến FR-02.11 của CAB System, phục vụ tìm kiếm, xếp hạng, gửi
    yêu cầu và phân công tài xế.
servers:
- url: http://localhost:8080/api/v1
tags:
- name: Driver Discovery
  description: Tìm kiếm, lọc và xếp hạng tài xế phù hợp.
- name: Dispatch
  description: Gửi yêu cầu nhận chuyến và xử lý phản hồi của tài xế.
- name: Booking
  description: Cập nhật trạng thái booking khi không tìm được tài xế.
paths:
  /drivers/locations:
    get:
      summary: Xác định vị trí tài xế
      operationId: getDriverLocations
      responses:
        '200':
          description: Lấy vị trí tài xế thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverLocation'
              example:
              - driverId: DRV001
                latitude: 10.825
                longitude: 106.631
              - driverId: DRV002
                latitude: 10.827
                longitude: 106.635
        '500':
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Driver Discovery
  /drivers/available:
    get:
      summary: Kiểm tra trạng thái tài xế
      operationId: getAvailableDrivers
      responses:
        '200':
          description: Danh sách tài xế AVAILABLE
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableDriver'
              example:
              - driverId: DRV001
                driverName: Nguyễn Văn A
                status: AVAILABLE
        '404':
          description: Không có tài xế AVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Driver Discovery
  /drivers/by-vehicle-type:
    get:
      summary: Kiểm tra loại xe của tài xế
      operationId: getDriversByVehicleType
      parameters:
      - name: vehicleType
        in: query
        required: true
        schema:
          type: string
          enum:
          - MOTORBIKE
          - CAR_4_SEAT
          - CAR_7_SEAT
        example: CAR_4_SEAT
      responses:
        '200':
          description: Danh sách tài xế có loại xe phù hợp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverVehicle'
              example:
              - driverId: DRV001
                vehicleType: CAR_4_SEAT
        '400':
          description: Loại xe không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Driver Discovery
  /drivers/ranked:
    get:
      summary: Xếp hạng tài xế
      operationId: getRankedDrivers
      responses:
        '200':
          description: Danh sách tài xế đã được xếp hạng
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankedDriver'
              example:
              - driverId: DRV001
                rating: 4.9
                rank: 1
              - driverId: DRV002
                rating: 4.7
                rank: 2
      tags:
      - Driver Discovery
  /drivers/nearest:
    get:
      summary: Ưu tiên tài xế gần khách hàng
      operationId: getNearestDrivers
      parameters:
      - name: pickupLatitude
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
        example: 10.8231
      - name: pickupLongitude
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
        example: 106.6297
      responses:
        '200':
          description: Danh sách tài xế theo thứ tự gần điểm đón
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NearbyDriver'
              example:
              - driverId: DRV001
                distanceKm: 0.8
              - driverId: DRV002
                distanceKm: 1.5
      tags:
      - Driver Discovery
  /dispatch-requests:
    post:
      summary: Gửi yêu cầu nhận chuyến
      operationId: sendTripRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchRequestInput'
            example:
              bookingId: BKG001
              driverId: DRV001
      responses:
        '201':
          description: Yêu cầu nhận chuyến đã được gửi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchRequest'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Dispatch
  /dispatch-requests/{requestId}:
    get:
      summary: Kiểm tra trạng thái chờ tài xế xác nhận
      operationId: getDispatchRequestStatus
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
        example: DREQ001
      responses:
        '200':
          description: Trạng thái yêu cầu nhận chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchStatus'
              example:
                requestId: DREQ001
                status: PENDING
        '404':
          description: Không tìm thấy yêu cầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Dispatch
  /dispatch-requests/{requestId}/reject:
    post:
      summary: Xử lý tài xế từ chối chuyến
      operationId: rejectTripRequest
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
        example: DREQ001
      responses:
        '200':
          description: Đã ghi nhận từ chối và chuyển sang tìm tài xế tiếp theo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectResult'
              example:
                requestId: DREQ001
                status: REJECTED
                nextAction: FIND_NEXT_DRIVER
        '404':
          description: Không tìm thấy yêu cầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Dispatch
  /dispatch-requests/{requestId}/timeout:
    post:
      summary: Xử lý tài xế không phản hồi
      operationId: timeoutTripRequest
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
        example: DREQ001
      responses:
        '200':
          description: Yêu cầu đã timeout và hệ thống chuyển sang tìm tài xế khác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeoutResult'
              example:
                requestId: DREQ001
                status: TIMEOUT
                nextAction: FIND_NEXT_DRIVER
        '404':
          description: Không tìm thấy yêu cầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Dispatch
  /dispatch-requests/{requestId}/accept:
    post:
      summary: Xác nhận tài xế nhận chuyến
      operationId: acceptTripRequest
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
        example: DREQ001
      responses:
        '200':
          description: Tài xế được xác nhận và chuyến được cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptResult'
              example:
                requestId: DREQ001
                driverId: DRV001
                tripId: TRIP001
                tripStatus: DRIVER_ASSIGNED
        '404':
          description: Không tìm thấy yêu cầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Dispatch
  /bookings/{bookingId}/driver-not-found:
    post:
      summary: Xử lý không tìm được tài xế
      operationId: markDriverNotFound
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
        example: BKG001
      responses:
        '200':
          description: Đã cập nhật trạng thái và ghi nhận thông báo cho khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverNotFoundResult'
              example:
                bookingId: BKG001
                status: DRIVER_NOT_FOUND
                customerNotification: Không tìm được tài xế phù hợp
        '404':
          description: Không tìm thấy Booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Booking
components:
  schemas:
    DriverLocation:
      type: object
      required:
      - driverId
      - latitude
      - longitude
      properties:
        driverId:
          type: string
          example: DRV001
        latitude:
          type: number
          format: double
          example: 10.825
        longitude:
          type: number
          format: double
          example: 106.631
    AvailableDriver:
      type: object
      required:
      - driverId
      - status
      properties:
        driverId:
          type: string
          example: DRV001
        driverName:
          type: string
          example: Nguyễn Văn A
        status:
          type: string
          enum:
          - AVAILABLE
          example: AVAILABLE
    DriverVehicle:
      type: object
      properties:
        driverId:
          type: string
          example: DRV001
        vehicleType:
          type: string
          example: CAR_4_SEAT
    RankedDriver:
      type: object
      properties:
        driverId:
          type: string
          example: DRV001
        rating:
          type: number
          format: double
          minimum: 0
          maximum: 5
          example: 4.9
        rank:
          type: integer
          example: 1
    NearbyDriver:
      type: object
      properties:
        driverId:
          type: string
          example: DRV001
        distanceKm:
          type: number
          format: double
          example: 0.8
    DispatchRequestInput:
      type: object
      required:
      - bookingId
      - driverId
      properties:
        bookingId:
          type: string
        driverId:
          type: string
    DispatchRequest:
      type: object
      properties:
        requestId:
          type: string
          example: DREQ001
        bookingId:
          type: string
          example: BKG001
        driverId:
          type: string
          example: DRV001
        status:
          type: string
          enum:
          - PENDING
          example: PENDING
    DispatchStatus:
      type: object
      properties:
        requestId:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          - TIMEOUT
    RejectResult:
      type: object
      properties:
        requestId:
          type: string
        status:
          type: string
          enum:
          - REJECTED
        nextAction:
          type: string
          enum:
          - FIND_NEXT_DRIVER
    TimeoutResult:
      type: object
      properties:
        requestId:
          type: string
        status:
          type: string
          enum:
          - TIMEOUT
        nextAction:
          type: string
          enum:
          - FIND_NEXT_DRIVER
    AcceptResult:
      type: object
      properties:
        requestId:
          type: string
        driverId:
          type: string
        tripId:
          type: string
        tripStatus:
          type: string
          enum:
          - DRIVER_ASSIGNED
    DriverNotFoundResult:
      type: object
      properties:
        bookingId:
          type: string
        status:
          type: string
          enum:
          - DRIVER_NOT_FOUND
        customerNotification:
          type: string
          example: Không tìm được tài xế phù hợp
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu yêu cầu không hợp lệ
